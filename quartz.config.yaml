# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Аволар"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: ru-RU
  baseUrl: toster69.github.io/avolar
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
       header: Literata
       body: Literata
       code: JetBrains Mono
    colors:
      lightMode:
        # --- ФОН: дорогая бумага цвета слоновой кости с тёплым подтоном ---
        light: "#F4EFE3"           # Основной фон — старая бумага / пергамент
        lightgray: "#E6DCC4"       # Панели, карточки — светлая латунь / тиснение
        gray: "#5C7A99"            # Мета-текст, иконки — выцветшая синяя эмаль
        darkgray: "#1B2A41"        # Основной текст — глубокие чернильно-синие чернила
        dark: "#0E1A2B"            # Заголовки — почти чёрный ультрамарин
        secondary: "#A81A22"       # КИНОВАРЬ — сургучные печати, акценты, ссылки
        tertiary: "#B8860B"        # ТЁМНОЕ ЗОЛОТО — наведение, интерактив
        highlight: rgba(184, 134, 11, 0.14)   # Лёгкое золотое свечение фона
        textHighlight: "#A81A2233"            # Красное выделение текста

      darkMode:
        # --- ФОН: ночной ультрамарин / бархат ар-деко ---
        light: "#0A1424"           # Глубокий полуночный синий — фон
        lightgray: "#152340"       # Панели — тёмная синяя сталь с золотым кантом
        gray: "#6F8FB3"            # Иконки, границы — окисленная сталь
        darkgray: "#E4DCC8"        # Основной текст — тёплый пергамент (мягче для глаз)
        dark: "#E8C766"            # Заголовки — полированное золото
        secondary: "#D4AF37"       # ЗОЛОТО — ссылки, папки, граф, активные элементы
        tertiary: "#C1121F"        # КРАСНЫЙ — наведение, фокус, «кровавая магия»
        highlight: rgba(193, 18, 31, 0.22)    # Красная подсветка активных зон
        textHighlight: "#D4AF3755"            # Золотое выделение текста

plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: gruvbox-light-medium
        dark: gruvbox-dark-medium
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false 
    options:
      theme: its-theme
      variation: ttrpg-dnd
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/bases-page"
    enabled: true
    order: 50
  - source: github:Requiae/quartz-leaflet-bases-plugin
    enabled: true
    options:
      enableCopyTool: false
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: false
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50

  # ================= РАСПОЛОЖЕНИЕ ЭЛЕМЕНТОВ (LAYOUT) =================
  
  # --- ЛЕВАЯ ПАНЕЛЬ ---
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 40
      group: toolbar
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: "Энциклопедия"
    layout:
      position: left
      priority: 50

  # --- ПРАВАЯ ПАНЕЛЬ ---
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 20
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 30

  # --- ЦЕНТР (НАД ТЕКСТОМ) ---
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 30
      display: all
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 40

  # --- ПОДВАЛ И ПРОЧЕЕ ---
  - source: "@quartz-community/spacer"
    enabled: true
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        # GitHub: https://github.com/jackyzha0/quartz
        # Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 10

layout:
  groups:
    toolbar:
      priority: 20
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
    