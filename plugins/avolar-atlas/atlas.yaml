  - { page: Зирк, x: 66.65, y: 56.13, type: city, note: Город изобретателей }
  - { page: Гра-Штталь, x: 93.65, y: 48.02, type: city, note: Город офицеров, Академия «Закон Стали» }
  - { page: Аб-Шер, x: 25.95, y: 93.52, type: fortress, note: Расселина и главный щит Коалиции на юге }
  - { page: Хель-Бур, x: 84.10, y: 36.16, type: fortress, note: Пограничная крепость, выгоревшая в 490 году }
  - { page: Мот-Феррум, x: 55.37, y: 45.49, type: city, note: Город-побратим Зирка, исчезнувший в 490 году, lost: true }

# --- Знаковые места (не города): красная звезда с подписью ---
#  Координаты пока примерные — поправьте кнопкой «Координаты» на карте.
