# =====================================================================
#  ИНТЕРАКТИВНАЯ КАРТА (страница «Карта»)
#
#  Координаты x / y — проценты от ширины и высоты карты (0–100),
#  те же, что в style="left: …; top: …" на старой странице «Карта».
#  Узнать координаты любой точки: кнопка «Координаты» на карте,
#  затем клик по нужному месту — значения скопируются.
#
#  Страницы — по названию заметки (как в Obsidian), картинки — по имени файла.
#  Включить / выключить: quartz.config.yaml, блок «./plugins/avolar-atlas».
# =====================================================================

title: Карта Аволара
intro: Коалиция Свободных Народов в 500 году Тьмы. Приближайте колесом или жестом, нажмите на метку, чтобы открыть карточку места.

# --- Картинки карты ---
image: work_map_v003.webp
aspect: 1

# --- Масштаб для линейки (пусто — линейка скрыта) ---
kmPerMapWidth:
kmPerDay:

# --- Типы мест: подписи и вид меток ---
types:
  city: Город
  fortress: Крепость
  lost: Пропавший город

# --- Места ---
#  lost: true — пропавший город (красный пунктир).
places:
