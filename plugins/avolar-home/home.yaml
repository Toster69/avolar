#  Включить / выключить новую главную: quartz.config.yaml,
#  блок «./plugins/avolar-home», строка enabled.
# =====================================================================

# --- Шапка: та же картинка и подпись, что на старой главной ---
hero:
  image: title.png
  text: >-
    «Аволар: Проклятие Жизни» — мир тёмного индустриального фэнтези для кампании
    по D&D 5e и прямое продолжение [Аволар: Жертва Героя](https://www.youtube.com/watch?v=YaylczwlXmA&list=PLcUtwUGrw8FJZvSkzkB1PsPFvlSKesm9H).
    Здесь собрана база знаний новой кампании: лор, персонажи, фракции, локации.

# --- Книга: Путеводитель по миру (баннер под шапкой) ---
#  Чтобы убрать баннер, удалите или закомментируйте этот блок.
#  Ссылки без url не показываются.
guide:
  # label: Вышла Книга игрока
  title: "Путеводитель по миру «Аволар: Проклятие Жизни»"
  cover: guide_cover.webp
  text: Короткий иллюстрированный путеводитель в PDF для тех, кто хочет быстро познакомиться с миром игры.
  download: { url: "https://disk.yandex.ru/d/GX_K9-UOpJyKlA", label: Скачать PDF }
  insideLabel: Что внутри
  inside:
    - Вступление в мир, который десять лет назад пережил Явление Звезды, и стихи поэта-ветерана.
    - "Космология: циклы Света и Тьмы, «Жертва Героя» и почему народы Коалиции лишены магии ([[О мире]])."
    - "[[Коалиция Свободных Народов]]: эстетика 1920-х, жители, идеология."
    - "История от 300 года до наших дней: [[Живой Металл]], война, плавильни и красный газ вместо пороха, [[Красная Полоса]] и Договор о Вечном Мире."
    - "Рескин классов на примерах наших героев: стрелок, подрывник, пилот доспеха, плавильщик и бард ([[О кампании]])."
    - "Столица [[Аркс-Феррум]]: Верхний и Нижний Аркс и Кольцо Плавилен."
    - Ссылки на все игры, базу знаний и каналы проекта.
  links:
    - { label: YouTube, url: "https://www.youtube.com/@ChronicleMove" }
    - { label: Telegram, url: "https://t.me/ChronicleMove" }
    - { label: Boosty, url: "https://boosty.to/toster69" }
    - { label: Discord, url: "https://discord.gg/ArnXMj2zW" }

# --- 1. Выберите путь (карточки переворачиваются) ---
paths:
  title: Выберите путь
  cards:
    - icon: compass
      title: Я здесь впервые
      teaser: Пять минут — и вы поймёте, что за мир перед вами.
      text: Начните с короткого введения в сеттинг, потом откройте карту и шкалу Тьмы ниже.
      links:
        - { page: О мире, label: Введение в мир }
        - { page: Карта, label: Карта мира }
    - icon: dice
      title: Особености игры
      teaser: Правила, требования к персонажам и рескин классов.
      text: Всё для подготовки персонажа — вопросы для предыстории и домашние правила.
      links:
        - { page: О кампании, label: Правила кампании }
        - { page: Персонажи игроков, label: Герои кампании }
    - icon: screen
      title: Cмотреть записи игр
      teaser: Записи игр, закулисье и обсуждение.
      text: Новые серии выходят на YouTube, ранний доступ — на Boosty, разговоры — в Discord.
      links:
        - { url: "https://www.youtube.com/@ChronicleMove", label: YouTube }
        - { url: "https://boosty.to/toster69", label: Boosty }
        - { url: "https://discord.gg/ArnXMj2zW", label: Discord }

# --- 2. Шкала Тьмы (интерактивная временная шкала) ---
#  year — год Тьмы (0–1000). red: true — событие-катастрофа.
#  Последнее событие считается «сейчас».
timeline:
  title: Шкала Тьмы
  intro: Божественный маятник проходит полный круг за тысячу лет. Сейчас — 500-й год Тьмы, половина пути.
  events:
    - year: 0
      title: Начало Тьмы
      text: Трон пантеона переходит к богу Тьмы. После Жертвы Героя люди, дварфы, гномы и орки оторваны от магии.
      page: О мире
    - year: 150
      title: Рождение Коалиции
      text: Королевство Звёзд идёт религиозным походом. Свободные народы объединяются в Коалицию и уходят в бесплодные горы.
      page: Коалиция Свободных Народов
    - year: 300
      title: Живой Металл
      text: Дварфы открывают союзникам Живой Металл. Королевство требует доступа к месторождениям, Коалиция отказывает — начинается Столетняя война.
      page: Живой Металл
    - year: 400
      title: Индустриализация
      text: Горны, гидроэлектростанции и паровые молоты. Сплавы Живого Металла дают ток — электричество становится основой армии Коалиции.
      page: Живой Металл
    - year: 490
      title: Явление Звезды
      text: Над фронтами вспыхивает 24-конечная Звезда. Десятки тысяч солдат обращаются в пар и красную пыль, на линии фронта возникает Красная Полоса.
      page: Явление Звезды
      red: true
    - year: 500
      title: Утро 500 года
      text: Десять лет после Катастрофы. Коалиция готовится ратифицировать Договор о Вечном Мире — здесь начинается кампания.
      page: Утро 500 года

# --- 3. Мир в пяти ссылках (плитки с иллюстрациями) ---
world:
  title: Мир в пяти ссылках
  tiles:
    - page: Коалиция Свободных Народов
      image: koalition_000.webp
      text: Люди, дварфы, гномы и орки против угасающей магии.
    - page: Королевство Звёзд
      image: STAR.webp
      text: Эльфы, зверолюды и песчаные народы, хранящие последнюю магию.
    - page: Живой Металл
      image: live_metal_001.webp
      text: Минерал, из-за которого началась война и на котором держится вся технология.
    - page: Явление Звезды
      image: Star_v001.webp
      text: Катастрофа 490 года, положившая конец Столетней войне.
    - page: Красная Полоса
      image: red_line.webp
      text: Искажённая зона на месте бывшего фронта.

# --- Карта мира (мини-карта с метками) ---
#  Чтобы убрать карту с главной, удалите или закомментируйте этот блок.
#  x и y меток — те же проценты, что в style="left: …; top: …" на странице «Карта».
#  crop — какой кусок карты показывать на главной (в процентах от картинки).
map:
  title: Карта мира
  intro: Восемь главных точек Коалиции. Наведите на метку, чтобы увидеть превью, нажмите, чтобы открыть город.
  image: world_map_v002.webp
  crop: { x: 18, y: 28, w: 82, h: 72 }
  fullMap: Карта
  markers:
    - { page: Аркс-Феррум, x: 80.90, y: 71.06, note: Столица Коалиции, capital: true }
    - { page: Гра-Штталь, x: 93.65, y: 48.02, note: Город офицеров }
    - { page: Хель-Бур, x: 84.10, y: 36.16, note: Выгоревшая крепость на границе }
    - { page: Зирк, x: 66.65, y: 56.13, note: Город изобретателей }
    - { page: Мот-Феррум, x: 55.37, y: 45.49, note: Пропавший город в Красной Полосе, lost: true }
    - { page: Ворн-Махт, x: 96.45, y: 88.27, note: Святая твердыня дварфов }
    - { page: Ас-Варк, x: 57.17, y: 91.48, note: Город-котловина }
    - { page: Аб-Шер, x: 25.95, y: 93.52, note: Расселина на юге }

