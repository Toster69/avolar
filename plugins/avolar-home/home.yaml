# =====================================================================
#  СОДЕРЖИМОЕ НОВОЙ ГЛАВНОЙ СТРАНИЦЫ
#
#  Страницы указываются так же, как в Obsidian-ссылках: по названию
#  заметки, её title или алиасу («Живой Металл», «О мире»).
#  Картинки — по имени файла из папки content (как в ![[...]]).
