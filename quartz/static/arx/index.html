<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аркс-Феррум — карта города</title>
<meta name="description" content="Интерактивная карта Аркс-Феррума, столицы Коалиции Свободных Народов: районы, места, персонажи и маршруты.">
<link rel="icon" href="../icon.png">
<script>
  // тема — та же, что выбрана на сайте
  try {
    var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
    document.documentElement.dataset.theme = t
  } catch (e) { document.documentElement.dataset.theme = "dark" }
</script>
<link rel="preload" href="map_lo.webp" as="image">
<link rel="stylesheet" href="arx.css">
</head>
<body>
<div class="arx" id="arx">

  <!-- карта -->
  <main class="stage" id="stage" tabindex="0" aria-label="Карта Аркс-Феррума. Перетаскивайте, чтобы двигать; колесо, жесты или плюс и минус — масштаб.">
    <div class="world" id="world">
      <img class="map" id="map" src="map_lo.webp" alt="Карта Аркс-Феррума" draggable="false" decoding="async">
      <svg class="route-layer" id="routeLayer" viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="districts" id="districts"></div>
      <div class="pins" id="pins"></div>
    </div>
    <div class="card" id="card" hidden></div>
    <div class="hint" id="hint" hidden></div>
  </main>

  <!-- верхняя панель -->
  <header class="top">
    <a class="back" id="backLink" href="../../">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>База знаний</span>
    </a>
    <div class="brand">
      <h1 id="title">Аркс-Феррум</h1>
      <p id="subtitle"></p>
    </div>
    <nav class="tools" aria-label="Меню карты">
      <button type="button" class="tool" data-open="left" aria-expanded="false" aria-controls="left">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Места</span>
      </button>
      <div class="layers-wrap">
        <button type="button" class="tool" id="layersBtn" aria-expanded="false" aria-controls="layersPop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5zM2 13l10 5 10-5M2 17.5l10 5 10-5"/></svg><span>Слои</span>
        </button>
        <div class="layers-pop" id="layersPop" hidden></div>
      </div>
      <button type="button" class="tool" data-open="right" aria-expanded="false" aria-controls="right">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg><span>Маршрут</span>
      </button>
      <button type="button" class="tool icon-only" id="themeBtn" aria-label="Сменить тему">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </nav>
  </header>

  <!-- левое меню: места -->
  <aside class="drawer left" id="left" aria-label="Места" hidden>
    <div class="drawer-head">
      <h2>Места</h2>
      <button type="button" class="x" data-close="left" aria-label="Закрыть меню мест">×</button>
    </div>
    <input type="search" class="search" id="search" placeholder="Найти место или персонажа" autocomplete="off" aria-label="Поиск">
    <div class="list" id="list"></div>
  </aside>

  <!-- правое меню: маршрут -->
  <aside class="drawer right" id="right" aria-label="Маршрут" hidden>
    <div class="drawer-head">
      <h2>Маршрут</h2>
      <button type="button" class="x" data-close="right" aria-label="Закрыть маршрут">×</button>
    </div>
    <div class="route-form">
      <label class="field">
        <span class="field-dot from" aria-hidden="true"></span>
        <span class="field-label">Откуда</span>
        <select id="fromSel"></select>
      </label>
      <button type="button" class="pick" id="pickBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>Указать точку на карте
      </button>
      <button type="button" class="swap" id="swapBtn" aria-label="Поменять местами">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 4 3.5 7.5M7 4l3.5 3.5M17 20V4m0 16-3.5-3.5M17 20l3.5-3.5"/></svg>
      </button>
      <label class="field">
        <span class="field-dot to" aria-hidden="true"></span>
        <span class="field-label">Куда</span>
        <select id="toSel"></select>
      </label>
      <div class="route-actions">
        <button type="button" class="btn primary" id="goBtn">Проложить</button>
        <button type="button" class="btn" id="clearBtn" hidden>Сбросить</button>
      </div>
    </div>
    <div class="route-result" id="routeResult" aria-live="polite"></div>
  </aside>

  <!-- управление картой -->
  <div class="controls" role="toolbar" aria-label="Управление картой">
    <button type="button" data-act="in" aria-label="Приблизить">+</button>
    <button type="button" data-act="out" aria-label="Отдалить">−</button>
    <button type="button" data-act="fit" aria-label="Весь город"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button type="button" data-act="coords" aria-pressed="false" aria-label="Узнать координаты точки"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></button>
  </div>
</div>

<script src="data.js"></script>
<script src="arx.js"></script>
</body>
</html>
